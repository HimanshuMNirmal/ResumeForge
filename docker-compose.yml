services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: resumeforge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_builder
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resumeforge_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://resume:${DB_PASSWORD}@db:5432/resume_builder
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      PLATFORM_ANTHROPIC_KEY: ${PLATFORM_ANTHROPIC_KEY:-}
      PLATFORM_OPENAI_KEY: ${PLATFORM_OPENAI_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in dev
      - ./src:/app/src:ro
      - ./backend/app:/app/app:ro
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./resume-web
      dockerfile: Dockerfile
      args:
        # Backend URL as seen FROM THE BROWSER (not from inside Docker network)
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: resumeforge_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ── pgAdmin (dev only) ─────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: resumeforge_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools  # only started with: docker compose --profile tools up

volumes:
  postgres_data:

