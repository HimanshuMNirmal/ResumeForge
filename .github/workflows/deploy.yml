name: Deploy — Build & Push to ECR, Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'Dockerfile*'
      - 'docker-compose*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build Docker image → ECR
    runs-on: ubuntu-latest
    environment: aws hosting
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'resumeforge-backend' }}
          SHA:        ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$SHA"
          LATEST="$REGISTRY/$REPOSITORY:latest"
          docker build -f backend/Dockerfile -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: aws hosting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate EC2 Secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::Missing EC2_HOST or EC2_SSH_KEY in repository secrets."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  180s
          script: |
            set -e
            cd /opt/resume-builder

            # Pull latest code using GitHub Actions token for private repo authentication
            git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
            git reset --hard FETCH_HEAD

            # Determine registry and image dynamically from commit SHA
            REGISTRY="${{ secrets.ECR_REGISTRY }}"
            if [ -z "$REGISTRY" ]; then
              REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            fi
            REPOSITORY="${{ secrets.ECR_REPOSITORY || 'resumeforge-backend' }}"
            IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
            echo "BACKEND_IMAGE=$IMAGE" > .image.env

            # Log in to ECR on the server
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin "$REGISTRY"

            # Ensure Postgres database is running
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              --env-file .env \
              up -d db

            # Pull new backend image from ECR
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              --env-file .env \
              --env-file .image.env \
              pull backend

            # Recreate backend container (force-recreate guarantees fresh container)
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              --env-file .env \
              --env-file .image.env \
              up -d --force-recreate --remove-orphans backend

            # Wait for backend health check (up to 30s)
            echo "Waiting for backend health check..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
                echo "✅ Backend is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting for health check... ($i/15)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Backend health check failed! Fetching logs..."
              docker logs resumeforge_backend --tail 100
              exit 1
            fi

            echo "🚀 Deployment successfully completed: ${{ needs.build-and-push.outputs.image }}"
