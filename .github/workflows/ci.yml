name: CI — Lint & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resume_test
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U resume -d resume_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e src[all]

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://resume:testpassword@localhost:5432/resume_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://resume:testpassword@localhost:5432/resume_test
          SECRET_KEY: ci-test-secret-key-min-32-chars-ok
          ENCRYPTION_KEY: ci-test-encryption-key-32bytes!!
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          S3_BUCKET_NAME: test-bucket
          S3_REGION: us-east-1
          PLATFORM_ANTHROPIC_KEY: ""
        run: |
          cd backend
          pytest tests/ -v --tb=short

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend/app/ --select=E,W,F,I
