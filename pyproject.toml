[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Personal, local-first AI resume tailoring tool (truthful, ATS-safe DOCX/PDF)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "rapidfuzz>=3.6",
  "httpx>=0.27",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
resume = "resume_builder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_builder = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
