version: "3.9"

# Production overrides — usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always
    # In production, expose only to internal network — no host port binding
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  backend:
    restart: always
    image: ${BACKEND_IMAGE}   # ECR image tag set by CI/CD
    # No volume mounts in production
    volumes: !reset []
    environment:
      DEBUG: "false"
      ALLOWED_ORIGINS: '["https://${FRONTEND_DOMAIN}"]'
      DATABASE_URL: postgresql+asyncpg://resume:${DB_PASSWORD}@db:5432/resume_builder
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      PLATFORM_ANTHROPIC_KEY: ${PLATFORM_ANTHROPIC_KEY}
      PLATFORM_OPENAI_KEY: ${PLATFORM_OPENAI_KEY}
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    ports:
      - "127.0.0.1:8000:8000"   # only accessible from nginx on the same host

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resumeforge_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  certbot_data:
